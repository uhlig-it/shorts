---
- name: Deploy the Shorts application
  hosts: all
  become: true
  gather_facts: true
  vars: # check secrets.yml for others
    # Released as a tarball by the release workflow (see README); adjust the
    # tag to an existing GitHub release before deploying.
    service_binary: https://github.com/uhlig-it/shorts/releases/download/v0.1.0/shorts-linux-amd64.tar.gz
  tasks:
    - name: Config file is present
      become: true
      copy:
        src: shorts.yml
        dest: /etc/shorts.yml
        mode: '0644'
      register: config_copied
      tags: [ shorts, yaml, config ]
    - name: Service is restarted
      systemd:
        name: shorts.service
        state: restarted
      when: config_copied.changed
      tags: [ systemd, service ]
  roles:
    - role: uhlig-it.simple_systemd_service
      become: true
      vars:
        program:
          name: shorts
          description: Shorts URL shortener
          binary: "{{ service_binary }}"
          runtime_user: shorts
          parameters:
            - -port
            - "{{ shorts_port }}"
            - -urls
            - /etc/shorts.yml
      tags: [ shorts, url, shortener, systemd, service ]
    - role: suhlig.caddy_reverse_proxy
      become: true
      vars:
        caddy_domain: "{{ shorts_fqdn }}"
        caddy_port: "{{ shorts_port }}"
      tags: [ shorts, url, shortener, caddy, proxy ]
