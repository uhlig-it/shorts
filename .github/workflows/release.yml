name: Release
on:
  push:
    tags: ["v*"]
jobs:
  build:
    strategy:
      matrix:
        goarch: [amd64, arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      # CGO_ENABLED=0 links statically; pure Go, so both architectures build
      # on the same runner.
      - name: Build statically linked binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -o shorts .
      # The simple_systemd_service role (used by the deployment playbook)
      # unpacks the asset into /usr/local/bin, so the binary must sit at the
      # top level of the tarball.
      - name: Package as release asset
        run: tar czf shorts-linux-${{ matrix.goarch }}.tar.gz shorts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: shorts-linux-${{ matrix.goarch }}.tar.gz
          path: shorts-linux-${{ matrix.goarch }}.tar.gz
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Produce SHA-256 checksums (consumed by deployment/playbook.yml's binary_checksum)
        run: |
          cd artifacts
          for f in *.tar.gz; do
            sha256sum "$f" > "$f.sha256"
          done
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: artifacts/*.tar.gz artifacts/*.sha256
