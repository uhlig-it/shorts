name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
concurrency:
  # One run per branch/PR at a time; a newer push supersedes the in-flight one.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Action versions are pinned to commit SHAs (supply-chain hardening); the
      # comments name the tag they were resolved from (tag only, e.g. `# v7`),
      # and Renovate bumps them via digest updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with: {go-version: '1.27.x'}
      - name: govulncheck
        run: go tool govulncheck ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
