name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
concurrency:
  # One run per branch/PR at a time; a newer push supersedes the in-flight one.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Action versions are pinned to commit SHAs (supply-chain hardening); the
      # comments name the tag they were resolved from, and Renovate bumps them
      # via digest updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # actions/setup-go@v5
        with: {go-version-file: go.mod}
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
  syntax-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deployment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
      - name: Install Ansible
        run: |
          python3 -m venv /tmp/ansible
          /tmp/ansible/bin/pip install ansible-core
      - name: Install the roles
        run: /tmp/ansible/bin/ansible-galaxy role install -r requirements.yml
      - name: Syntax check the playbook
        run: /tmp/ansible/bin/ansible-playbook --syntax-check playbook.yml